.sess-title{font-size:17px;font-weight:600;letter-spacing:-0.3px;margin-bottom:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid}
.blocs{padding:10px 14px}
.bloc{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid rgba(0,0,0,0.08)}
.bloc:last-child{border:none}
.b-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.b-info{flex:1;min-width:0}
.b-name{font-size:14px;font-weight:600}
.b-dur{font-size:12px;color:#8E8E93;margin-top:2px}

.g-note{font-size:11px;color:#C0392B;font-weight:600;margin-top:7px}

.j-section-title{font-size:13px;font-weight:500;color:#8E8E93;margin-bottom:8px;padding:0 2px}

.j-lbl{font-size:12px;color:#8E8E93;font-weight:500}
.j-val{font-size:20px;font-weight:600;color:#1C1C1E}

.j-flbl{font-size:11px;color:#8E8E93;font-weight:500;padding:10px 14px 3px}

<div class="app">

  <button class="tab-btn" onclick="switchTab('journal')">Journal</button>
</div>
<div class="content">

    <div id="today-content"></div>

      <div class="j-section-title">📝 Remplir après la séance</div>
      <div class="j-slider">
        <div class="j-slider-top"><span class="j-lbl">Douleur mollet</span><span class="j-val" id="sv1">0<span style="font-size:14px;color:#8E8E93">/10</span></span></div>

      <div class="j-slider">
        <div class="j-slider-top"><span class="j-lbl">Fatigue générale</span><span class="j-val" id="sv2">0<span style="font-size:14px;color:#8E8E93">/10</span></span></div>

      </div>

      <div class="j-field"><div class="j-flbl">Durée réelle (min)</div><input class="j-input" type="number" placeholder="ex : 45" id="ji-dur"></div>
      <div class="j-field"><div class="j-flbl">Ressenti global</div><textarea class="j-input" rows="2" placeholder="Comment s'est passée la séance ?" id="ji-ressenti"></textarea></div>
      <div class="j-field"><div class="j-flbl">Notes libres</div><textarea class="j-input" rows="2" placeholder="Conditions, équipement, gel testé..." id="ji-notes"></textarea></div>
      <button class="save-btn" onclick="saveEntry()">Enregistrer la séance</button>
      <div class="saved-msg" id="saved-msg">✅ Séance enregistrée</div>
    </div>
  </div>
  <div class="section" id="tab-calendar"><div id="cal-content"></div></div>
  <div class="section" id="tab-journal"><div id="journal-hist"></div></div>
</div>
<div class="nav-bar">
  <button class="nav-btn active" id="nav-today" onclick="switchTab('today')"><span class="nav-icon">🏃</span>Aujourd'hui</button>
  <button class="nav-btn" id="nav-calendar" onclick="switchTab('calendar')"><span class="nav-icon">📅</span>Calendrier</button>
  <button class="nav-btn" id="nav-journal" onclick="switchTab('journal')"><span class="nav-icon">📓</span>Journal</button>
</div>
</div>

var savedEntries=[];
var currentKey=null;

var PS={
  recup:{bg:'#E8F5E9',border:'#2E7D32',txt:'#2E7D32',badge:'Récup'},
  base: {bg:'#DDEEFF',border:'#1565C0',txt:'#1565C0',badge:'Bases'},
  build:{bg:'#E8F5E9',border:'#2E7D32',txt:'#2E7D32',badge:'Construction'},
  vol:  {bg:'#E3F2FD',border:'#1565C0',txt:'#1565C0',badge:'Volume pic'},
  plat: {bg:'#FFF8E1',border:'#F57F17',txt:'#F57F17',badge:'Plateau'},
  aff:  {bg:'#FCE4EC',border:'#B71C1C',txt:'#B71C1C',badge:'Affûtage'},
  race: {bg:'#FFF9C4',border:'#B8860B',txt:'#B8860B',badge:'Course'},
};

function ps(p){return PS[p]||PS.recup;}

function zonePill(z){
  if(z.includes('4')) return 'background:#FFEBEE;color:#B71C1C;border-color:#FFCDD2';
  if(z.includes('3')) return 'background:#FFF3E0;color:#E65100;border-color:#FFE0B2';
  if(z.includes('2')) return 'background:#EBF3FF;color:#1565C0;border-color:#BBDEFB';
  return 'background:#F3E5F5;color:#4A148C;border-color:#E1BEE7';
}

function getToday(){return new Date().toISOString().slice(0,10);}

function findTodaySession(){
  var td=getToday();
  for(var i=0;i<SESSIONS.length;i++){if(SESSIONS[i].date===td)return SESSIONS[i];}
  for(var i=0;i<SESSIONS.length;i++){if(SESSIONS[i].date>td)return SESSIONS[i];}
  return SESSIONS[SESSIONS.length-1];
}

function renderSession(s){
  var p=ps(s.phase);
  var html='<div class="sess-card" style="background:'+p.bg+';border-color:'+p.border+'">';
  html+='<div class="sess-head">';
  html+='<div class="sess-date">'+s.label+' — '+p.badge+'</div>';
  html+='<div class="sess-title">'+s.title+'</div>';
  html+='<div class="pills">';
  html+='<span class="pill" style="background:'+p.bg+';color:'+p.txt+';border-color:'+p.border+'">'+s.dur+'</span>';
  if(s.den!=='0 m') html+='<span class="pill" style="background:'+p.bg+';color:'+p.txt+';border-color:'+p.border+'">'+s.den+'</span>';
  html+='<span class="pill" style="'+zonePill(s.zone)+'">'+s.zone+'</span>';
  html+='</div></div>';
  html+='<div class="blocs">';
  s.blocs.forEach(function(b){
    html+='<div class="bloc"><div class="b-icon" style="background:'+b.bg+'">'+b.em+'</div>';
    html+='<div class="b-info"><div class="b-name">'+b.nm+'</div>';
    html+='<div class="b-dur">'+b.dur+'</div>';
    html+='<div class="b-desc">'+b.desc.replace(/\n/g,'<br>')+'</div>';
    html+='</div></div>';
  });
  html+='</div>';
  html+='<div class="garmin-box">';
  html+='<div class="garmin-ttl">⌚ Garmin Connect — étapes à entrer</div>';
  s.garmin.forEach(function(g){html+='<div class="g-step"><span>'+g[0]+'</span><span>'+g[1]+'</span></div>';});
  html+='<div class="g-note">'+s.gnote.replace(/\n/g,'<br>')+'</div>';
  html+='</div>';
  html+='<div class="key-tip"><p>'+s.cle+'</p></div>';
  html+='</div>';
  return html;
}

function loadToday(){
  var s=findTodaySession();
  currentKey=s.key;
  document.getElementById('today-content').innerHTML=renderSession(s);
  var p=ps(s.phase);
  var badge=document.getElementById('hdr-badge');
  badge.textContent=p.badge;
  badge.style.background=p.bg;
  badge.style.color=p.txt;
  badge.style.border='1px solid '+p.border;
  var race=new Date('2026-11-22');
  var diff=Math.ceil((race-new Date())/(1000*60*60*24));
  document.getElementById('hdr-sub').textContent='Race day : dim. 22 nov. 2026 · J-'+Math.max(0,diff);
  document.getElementById('journal-form').style.display='block';
}

function renderCalendar(){
  var weeks={};var weekOrder=[];
  SESSIONS.forEach(function(s){
    if(!weeks[s.weekLbl]){weeks[s.weekLbl]=[];weekOrder.push(s.weekLbl);}
    weeks[s.weekLbl].push(s);
  });
  var td=getToday();
  var html='';
  weekOrder.forEach(function(wk){
    html+='<div class="week-grp"><div class="week-lbl">'+wk+'</div>';
    weeks[wk].forEach(function(s){
      var p=ps(s.phase);
      var isT=(s.date===td);
      var extra=isT?' today-row':'';
      var badge='';
      if(s.done) badge='<span class="badge b-ok">✓ OK</span>';
      else if(isT) badge='<span class="badge b-today">Aujourd\'hui</span>';
      else badge='<span style="color:#C6C6C8;font-size:18px">›</span>';
      html+='<div class="cal-row'+extra+'" style="background:'+p.bg+';border-color:'+p.border+'" onclick="openSession(\''+s.key+'\')">';
      html+='<div class="cal-dot '+s.dot+'"></div>';
      html+='<div class="cal-info"><div class="cal-date">'+s.label+'</div>';
      html+='<div class="cal-type" style="color:'+p.txt+'">'+s.title+'</div>';
      html+='<div class="cal-meta">'+s.dur+' · '+s.den+' · '+s.zone+'</div></div>'+badge+'</div>';
    });
    html+='</div>';
  });
  html+='<div style="background:linear-gradient(135deg,#2E7D32,#66BB6A);border-radius:13px;padding:18px;text-align:center;margin-top:4px">';
  html+='<div style="font-size:22px;margin-bottom:6px">🏁</div>';
  html+='<div style="font-size:17px;font-weight:700;color:#fff">Dimanche 22 novembre 2026</div>';
  html+='<div style="font-size:13px;color:rgba(255,255,255,0.9);margin-top:4px">Trail 19km 400D+ · RACE DAY !</div>';
  html+='<div style="font-size:12px;color:rgba(255,255,255,0.8);margin-top:4px">Allure EF · Power hiking · Profiter de chaque km 🏔️</div>';
  html+='</div>';
  document.getElementById('cal-content').innerHTML=html;
}

function renderJournal(){
  var hist='<div class="j-section-title">📜 Historique des séances</div>';
  var done=SESSIONS.filter(function(s){return s.done;}).reverse();
  done.forEach(function(s){
    var p=ps(s.phase);
    hist+='<div class="hist-card">';
    hist+='<div class="hist-head"><div><div class="hist-date-lbl">'+s.label+' · '+p.badge+'</div>';
    hist+='<div class="hist-ttl">'+s.title+'</div></div>';
    if(s.past&&s.past.doul) hist+='<span class="badge b-ok">'+s.past.doul+'</span>';
    hist+='</div>';
    if(s.past&&s.past.ress) hist+='<div class="hist-body">'+s.past.ress+'</div>';
    hist+='</div>';
  });
  savedEntries.forEach(function(e){
    var card='<div class="hist-card"><div class="hist-head"><div><div class="hist-date-lbl">'+e.date+' — Enregistré</div><div class="hist-ttl">'+e.title+'</div></div><span class="badge b-ok">'+e.doul+'/10</span></div>';
    card+='<div class="hist-body">Fatigue: '+e.fat+'/10'+(e.deniv?' · '+e.deniv:'')+(e.dur?' · '+e.dur+' min':'')+(e.ress?'<br>'+e.ress:'')+'</div></div>';
    hist=card+hist;
  });
  if(savedEntries.length===0&&done.length===0){
    hist+='<div style="text-align:center;padding:32px 16px;color:#8E8E93;font-size:14px">Aucune séance enregistrée<br>Complète les formulaires après chaque sortie 💪</div>';
  }
  document.getElementById('journal-hist').innerHTML=hist;
}

function openSession(key){
  var s=SESSIONS.find(function(x){return x.key===key;});
  if(!s)return;
  currentKey=key;
  document.getElementById('today-content').innerHTML=renderSession(s);
  document.getElementById('journal-form').style.display='block';
  switchTab('today');
  setTimeout(function(){window.scrollTo(0,0);},50);
}

function switchTab(tab){
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  var m={today:0,calendar:1,journal:2};
  document.querySelectorAll('.tab-btn')[m[tab]].classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  if(tab==='journal')renderJournal();
}

function checkDouleur(v){
  document.getElementById('douleur-alert').style.display=parseInt(v)>=4?'block':'none';
}

function saveEntry(){
  var s=SESSIONS.find(function(x){return x.key===currentKey;});
  var doul=document.querySelectorAll('input[type=range]')[0].value;
  var fat=document.querySelectorAll('input[type=range]')[1].value;
  savedEntries.unshift({
    date:s?s.label:'Séance',title:s?s.title:'',
    doul:doul,fat:fat,
    deniv:document.getElementById('ji-deniv').value,
    dur:document.getElementById('ji-dur').value,
    ress:document.getElementById('ji-ressenti').value,
    notes:document.getElementById('ji-notes').value
  });
  // Mark as done
  if(s){s.done=true;if(!s.past)s.past={doul:doul+'/10',fat:fat+'/10',ress:document.getElementById('ji-ressenti').value,act:''};}
  document.getElementById('ji-deniv').value='';
  document.getElementById('ji-dur').value='';
  document.getElementById('ji-ressenti').value='';
  document.getElementById('ji-notes').value='';
  document.querySelectorAll('input[type=range]').forEach(function(r){r.value=0;});
  document.getElementById('sv1').innerHTML='0<span style="font-size:14px;color:#8E8E93">/10</span>';
  document.getElementById('sv2').innerHTML='0<span style="font-size:14px;color:#8E8E93">/10</span>';
  document.getElementById('douleur-alert').style.display='none';
  var msg=document.getElementById('saved-msg');
  msg.style.display='block';
  setTimeout(function(){msg.style.display='none';renderCalendar();renderJournal();switchTab('journal');},1200);
}

loadToday();
renderCalendar();
</script>
